                <h1>Modern desktop windows, in&nbsp;plain Go</h1>
                <p>Write the window in Go: boxes, texts, buttons and ready components appear in a small window of its own. Only Go: no JavaScript, no HTML, no CSS, no front-end build. The built program is one file.</p>
                <p>v0.2.2 · experimental · Go 1.22+ · tested on macOS and Windows · 83 components, each with its own Go type · basic.js inside: about 3.5 MB, no internet · no Node, no npm · Apache 2.0</p>
                <p><code>go get github.com/bug7a/ozdenui-go</code></p>
                <h2>A counter in a few lines</h2>
                <p>Groups place the objects for you, and a Go function given to a button runs when it is clicked.</p>
                <ul>
                    <li><b>A group is a function.</b> The objects made in the function of a group go into it: the shape of the code is the shape of the window.</li>
                    <li><b>Values in Go.</b> label.SetText() changes the window; field.Text() and box.Checked() are read in Go, with no question to the window.</li>
                    <li><b>One goroutine, no locks.</b> start(), an event and a timer run one at a time. The changes of a task go to the window together, when it ends.</li>
                </ul>
                <h2>One file, typed, easy to read</h2>
                <ul>
                    <li><b>One file, offline.</b> basic.js and its components are inside the program (go:embed, about 3.5 MB). go build makes one file to share: no internet, no Node, no front-end build.</li>
                    <li><b>Types your editor knows.</b> Every component has its own Props struct, made from the kit: the editor offers the fields with their defaults, and a wrong field name does not compile.</li>
                    <li><b>Code that reads like the window.</b> Groups are functions, the names are those of basic.js, events are Go functions. A wrong name in Set() is told in the terminal with the line of your program.</li>
                    <li><b>Goroutines welcome.</b> A slow job runs in a goroutine of its own and the window does not wait. ui.Do() brings its result back to the objects.</li>
                </ul>
                <h2>Ready components, typed in Go</h2>
                <p>SmartButton, TextField, EmailField, PasswordField, NumberField, UrlField, PhoneField, CurrencyField, TextAreaField, SearchInput, TagInput, CheckBox, Toggle, RadioButton, SelectBox, Slider, RangeSlider, SliderField, Stepper, DatePicker, TimePicker, ColorPicker, FilePicker, ProgressBar, StepBar, ItemList, SortableList, SmartTable, DataTable, TreeView, Tabs, Accordion, GridGroup, ScrollArea, Splitter, SidePanel, GraphBox, Gauge, LogView, ImageView, MarkdownView, JsonView, JsonEditor, CodeEditor, Canvas, ChatView, WebView, MenuBar, ToolBar, StatusBar, ContextMenu, Tooltip and the others of the 83. Each one is a function with its own Props struct; ui.Component() makes any of them by its name.</p>
                <h2>A component of your own, in plain Go</h2>
                <p>A function that makes its objects in a group is a component: use it again and again, change it with its methods, share it as a package. No JavaScript is needed.</p>
                <h2>A dialog that returns its answer</h2>
                <p>ui.Confirm() waits for the answer and returns it, like any function. The window keeps working meanwhile: timers run and the page is drawn.</p>
                <h2>Twenty-one small programs</h2>
                <p>A small code editor, A small Markdown editor, A small JSON viewer, CSV viewer, A chat, Charts, Image viewer, A job and its log, A form, Settings, To do, Notes, Dialogs, Gallery, The minimal look, Calculator, The basic objects, Counter, Greeting, Clock and Catch the dots, in the examples folder of the repository.</p>
                <h2>Where it fits</h2>
                <p>A good choice for a small tool or a command line program that needs a window, for a tool given to your team as one file, and for a modern look without HTML, CSS or a front-end build. For more than one window (v0.2.2 has one window for a program), a large desktop application (Fyne or Gio), a front end written in HTML and JavaScript (Wails) or a web application for many users, something else is better.</p>
                <h2>Three steps</h2>
                <ol>
                    <li><b>Get it.</b> go get github.com/bug7a/ozdenui-go. On macOS it needs cgo: the command line tools of Xcode. On Windows and Linux no C compiler is needed.</li>
                    <li><b>Write start(page).</b> Make the objects of the window in it. Groups place them; a Go function runs on a click.</li>
                    <li><b>Run it.</b> go run . opens a window; go build makes one file to share.</li>
                </ol>
                <p><a href="handbook/" style="color: inherit;">The handbook</a>: from the first window to a component of your own, in English and Turkish.</p>
                <p>Go 1.22+. Tested on macOS and Windows: the window is the web view of the system (WKWebView, WebView2). On Linux it is an app window of Edge or Chrome, checked by the tests of the repository, not yet by hand.</p>
