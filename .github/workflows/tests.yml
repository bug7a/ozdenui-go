# Every push: the tests (with a real page in a hidden browser), then a picture of every example, light and dark,
# on macOS, Windows and Linux; the programs of the handbook once, on Linux.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        go: ["1.22", "stable"]  # the oldest the module takes, the newest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: The kit copy and kit_gen.go agree
        shell: bash
        run: |
          go run ./internal/gen
          git diff --exit-code kit_gen.go
      - name: The tests
        run: go test ./...
      - name: Every example in a hidden browser
        shell: bash
        run: checks/look-all.sh pictures
      - name: Every program of the handbook in a hidden browser
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: checks/handbook.sh pictures/handbook
      - name: The pictures of the windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ matrix.os }}-${{ matrix.go }}
          path: pictures
          if-no-files-found: ignore

  # The window of Linux: WebKitGTK of the system, loaded when the program runs (window_linux.go), built without cgo
  # and with only the library of WebKitGTK (no -dev package, no C compiler); a real window under a virtual screen
  # (xvfb) that measures its page and closes itself. WHY the check of the browser: Chrome is on the runner, and a
  # failed web view would open its window instead.
  linux-gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: WebKitGTK, only its library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xvfb xauth
      - name: A real window of WebKitGTK that measures its page
        shell: bash
        run: |
          export CGO_ENABLED=0 PROBE_CLOSE=1 PROBE_REPORT="$PWD/page.txt"
          timeout 120 xvfb-run -a go run ./checks/window-check
          echo "The page: $(cat page.txt)"
          grep -q "^480 x 320" page.txt
          grep -q "Safari" page.txt && ! grep -q "Chrome" page.txt

  # The tagged path of Linux (-tags ozdenui_webview: the web view of the system, WebKitGTK, with cgo): built, then a
  # real window under a virtual screen (xvfb) that measures its page and closes itself.
  # WHY 22.04: webview_go asks for webkit2gtk-4.0, which Ubuntu 24.04 and newer no longer have (only 4.1).
  linux-webview:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb
      - name: Build with the web view of the system
        run: go build -tags ozdenui_webview ./...
      - name: A real window that measures its page
        shell: bash
        run: |
          export PROBE_CLOSE=1 PROBE_REPORT="$PWD/page.txt"
          timeout 120 xvfb-run -a go run -tags ozdenui_webview ./checks/window-check
          echo "The page: $(cat page.txt)"
          grep -q "^480 x 320" page.txt
